<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Corne Layout</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
    }

    .main-wrapper {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 30px;
      max-width: 100%;
    }

    #keyboard {
      flex-shrink: 0;
    }

    #typing-test {
      position: sticky;
      top: 20px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 24px;
      min-width: 380px;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    #typing-test h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #e94560;
      text-align: center;
      letter-spacing: 1px;
    }

    .text-select-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .text-select {
      flex: 1;
      padding: 8px 12px;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #533483;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    .text-select:focus {
      outline: none;
      border-color: #e94560;
    }

    .reset-btn {
      padding: 8px 14px;
      background: #533483;
      color: #e0e0e0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn:hover {
      background: #e94560;
    }

    .wpm-display {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #e94560;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .text-display {
      background: #0a0a1a;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 16px;
      font-size: 15px;
      line-height: 1.8;
      min-height: 120px;
      max-height: 240px;
      overflow-y: auto;
      word-wrap: break-word;
      margin-bottom: 12px;
      user-select: none;
      cursor: default;
    }

    .text-display::-webkit-scrollbar {
      width: 6px;
    }

    .text-display::-webkit-scrollbar-track {
      background: #0a0a1a;
      border-radius: 3px;
    }

    .text-display::-webkit-scrollbar-thumb {
      background: #533483;
      border-radius: 3px;
    }

    .char {
      transition: color 0.1s;
    }

    .char.pending {
      color: #4a4a6a;
    }

    .char.current {
      color: #e0e0e0;
      border-bottom: 2px solid #e94560;
    }

    .char.correct {
      color: #4ade80;
    }

    .char.wrong {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.25);
      border-radius: 2px;
    }

    .typing-input {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div id="keyboard">
SVG_PLACEHOLDER
    </div>

    <div id="typing-test">
      <h2>⌨ TYPING TEST</h2>
      <div class="text-select-row">
        <select class="text-select"></select>
        <button class="reset-btn">Reset</button>
      </div>
      <div class="wpm-display">WPM: 0</div>
      <div class="text-display"></div>
      <input class="typing-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="hint">Type the text • Backspace to correct • ESC to restart</div>
    </div>
  </div>

  <script src="sample-texts.js"></script>
  <script src="app.js"></script>
  <script>
    // Initialize typing test after DOM is ready
    document.addEventListener('DOMContentLoaded', initTypingTest);
  </script>
</body>
</html>
