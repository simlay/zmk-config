name: Deploy keymap to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install keymap-drawer
        run: pipx install keymap-drawer

      - name: Build interactive keymap
        run: make render

      - name: Deploy to gh-pages
        run: |
          git config --global user.email "sebastian.imlay@gmail.com"
          git config --global user.name "Sebastian Imlay"
          git checkout --orphan gh-pages
          echo '<meta http-equiv="refresh" content="0; url=keymap-drawer/index.html"><a href="keymap-drawer/index.html">Redirect</a>' > index.html
          git add index.html
          git add --force keymap-drawer/
          git rm -r --cached .
          git reset
          git add keymap-drawer/ index.html
          git commit -m "Deploy keymap"
          git push origin gh-pages --force
