name: Deploy keymap to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    with:
      keymap_patterns: 'config/*.keymap'
      destination: artifact

  deploy:
    needs: draw
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download keymap-drawer output
        uses: actions/download-artifact@v8
        with:
          name: drawings
          path: keymap-drawer
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build interactive
        working-directory: ./keymap-drawer
        run: trunk build --release

      - name: Deploy to gh-pages
        run: |
          git config --global user.email "sebastian.imlay@gmail.com"
          git config --global user.name "Sebastian Imlay"
          git checkout --orphan gh-pages
          mv keymap-drawer/dist/* ./
          git add --force index.html keymap-drawer-*.wasm keymap-drawer-*.js
          git rm -r --cached .
          git reset
          git add index.html keymap-drawer-*.wasm keymap-drawer-*.js
          git commit --allow-empty -m "Deploy keymap"
          git push origin gh-pages --force
